services:
  - type: web
    name: agriconnect
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn agriconnect.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        sync: false
      - key: RUN_SEEDS_ON_BUILD
        value: "true"

